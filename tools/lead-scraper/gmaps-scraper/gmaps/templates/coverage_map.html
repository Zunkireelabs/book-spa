<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coverage map</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="preconnect" href="https://server.arcgisonline.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap">
<style>
:root{ --ink:#14201C; --muted:#66716D; --line:#E6EAE8; --soft:#F3F5F4; --green:#12805C; --amber:#E0A030; --red:#E04B35; }
*{box-sizing:border-box}
html,body{height:100%; margin:0}
body{font:500 14px "DM Sans",system-ui,sans-serif; color:var(--ink)}
#map{position:absolute; inset:0; background:#E9EEEA}
.leaflet-container{font-family:inherit}
.float{position:absolute; z-index:1000; background:#fff; box-shadow:0 6px 24px rgb(20 32 28/.18), 0 1px 3px rgb(20 32 28/.10)}

.panel{top:16px; left:16px; width:372px; max-height:calc(100% - 150px); border-radius:18px; display:flex; flex-direction:column; overflow:hidden}
.search{display:flex; align-items:center; gap:10px; padding:0 16px; height:54px; border-bottom:1px solid var(--line)}
.search svg{flex:none; color:var(--muted)}
.search input{flex:1; border:0; outline:0; font:500 15px "DM Sans",sans-serif; color:var(--ink); background:none; min-width:0}
.search input::placeholder{color:#97A09C}
.search button{border:0; background:none; color:var(--muted); font-size:20px; line-height:1; cursor:pointer; padding:4px; display:none}
.search.has button{display:block}
.sum{padding:11px 18px; font-size:13px; color:var(--muted); border-bottom:1px solid var(--line)}
.sum b{color:var(--ink); font-weight:700}
.head{padding:14px 18px 6px; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted)}
.list{overflow-y:auto; padding:0 8px 10px}
.row{display:flex; align-items:center; gap:12px; width:100%; text-align:left; background:none; border:0; font:inherit; color:inherit; padding:10px; border-radius:12px; cursor:pointer}
.row:hover,.row:focus-visible{background:var(--soft); outline:0}
.ico{flex:none; width:34px; height:34px; border-radius:50%; background:var(--soft); display:grid; place-items:center; color:var(--muted)}
.row b{display:block; font-weight:600; font-size:14.5px}
.row span span{display:block; font-size:12.5px; color:var(--muted); font-weight:400}
.dotk{width:9px; height:9px; border-radius:50%; flex:none; margin-left:auto}
.empty{padding:16px 18px 18px; color:var(--muted); font-weight:400; font-size:13.5px}

.seg{top:16px; left:calc(50% + 100px); transform:translateX(-50%); display:flex; gap:2px; padding:5px; border-radius:999px}
.seg button{font:inherit; font-weight:600; border:0; background:none; color:var(--muted); padding:10px 17px; border-radius:999px; cursor:pointer; display:flex; align-items:center; gap:8px; white-space:nowrap}
.seg button i{width:10px; height:10px; border-radius:50%; display:block}
.seg button[aria-pressed="true"]{background:var(--ink); color:#fff}

.navlink{top:16px; right:16px; display:flex; gap:2px; padding:5px; border-radius:999px}
.navlink a{font-weight:600; font-size:13.5px; padding:10px 16px; border-radius:999px; color:var(--muted); text-decoration:none}
.navlink a.on{background:var(--ink); color:#fff}
.type{left:16px; bottom:26px; display:flex; gap:10px; padding:8px; border-radius:16px}
.type button{border:2px solid transparent; background:none; padding:0; border-radius:11px; cursor:pointer; text-align:center; font:600 11.5px "DM Sans",sans-serif; color:var(--muted); width:74px}
.type button .sw{display:block; height:48px; border-radius:9px; margin-bottom:4px}
.type button[aria-pressed="true"]{border-color:var(--ink); color:var(--ink)}
.sw.m{background:linear-gradient(135deg,#F1E8CF 0 45%,#E9C9A8 45% 52%,#F1E8CF 52% 70%,#CFE0C4 70%)}
.sw.s{background:linear-gradient(135deg,#3C5C34,#5C6E45 40%,#7C7656 65%,#2E4630)}

.legend{right:70px; bottom:26px; border-radius:14px; padding:11px 14px; font-size:13px; display:grid; gap:7px}
.legend div{display:flex; align-items:center; gap:10px}

.pin{filter:drop-shadow(0 3px 3px rgb(0 0 0/.35))}
.zone-label{background:none; border:0; box-shadow:none; font:700 12.5px "DM Sans",sans-serif; padding:0; color:#14201C;
  text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 5px #fff,0 0 6px #fff}
.sat .zone-label{color:#fff; text-shadow:0 1px 3px rgb(0 0 0/.9),0 0 6px rgb(0 0 0/.8)}
.zone-label:before{display:none}
.leaflet-control-zoom{border:0!important; box-shadow:0 6px 24px rgb(20 32 28/.18)!important; border-radius:14px; overflow:hidden}
.leaflet-popup-content-wrapper{border-radius:14px}
.pop{font:400 13px/1.5 "DM Sans",sans-serif; min-width:210px}
.pop b{font-weight:700; font-size:14.5px}
.pop .m{color:var(--muted); margin-top:1px}
.pop .st{display:inline-flex; align-items:center; gap:6px; margin-top:8px; font-weight:600; text-transform:capitalize}
.pop .st i{width:9px; height:9px; border-radius:50%; display:block}
.pop .acts{margin-top:10px; display:flex; flex-wrap:wrap; gap:6px}
.pop a{font-weight:600; font-size:12.5px; border-radius:999px; padding:6px 11px; text-decoration:none; background:var(--soft); color:var(--ink)}
.pop a.wa{background:#12805C; color:#fff}
.pop .id{margin-top:8px; color:#97A09C; font-size:11.5px}

@media (max-width:820px){
  .panel{width:calc(100% - 32px); max-height:46%}
  .seg{top:auto; bottom:110px; left:50%}
  .legend{display:none}
  .type{bottom:16px}
}
</style>
</head>
<body>
<div id="map"></div>

<div class="float panel">
  <div class="search" id="searchbox">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="text" placeholder="Search a city or area" autocomplete="off" aria-label="Search a city or area">
    <button id="clear" type="button" aria-label="Clear">&times;</button>
  </div>
  <div class="sum" id="sum"></div>
  <div class="head" id="head">Areas</div>
  <div class="list" id="list"></div>
</div>

<nav class="float navlink" aria-label="Pages"><a href="/" class="on">Map</a><a href="/dashboard">Dashboard</a></nav>

<div class="float seg" id="seg">
  <button data-v="all" aria-pressed="true">All</button>
  <button data-v="have" aria-pressed="false"><i style="background:var(--green)"></i>Where we are</button>
  <button data-v="not" aria-pressed="false"><i style="background:var(--red)"></i>Where we are not</button>
</div>

<div class="float type" id="type">
  <button data-t="map" aria-pressed="true"><span class="sw m"></span>Map</button>
  <button data-t="sat" aria-pressed="false"><span class="sw s"></span>Satellite</button>
</div>

<div class="float legend">
  <div><svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="#12805C" fill-opacity=".22" stroke="#12805C" stroke-width="1.5"/></svg>Reached</div>
  <div><svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="#E0A030" fill-opacity=".22" stroke="#E0A030" stroke-width="1.5"/></svg>Partly reached</div>
  <div><svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="#E04B35" fill-opacity=".16" stroke="#E04B35" stroke-width="1.5" stroke-dasharray="3 3"/></svg>Found, not contacted</div>
  <div><svg width="18" height="18"><circle cx="9" cy="9" r="8" fill="#8E9692" fill-opacity=".08" stroke="#8E9692" stroke-width="1.5" stroke-dasharray="3 3"/></svg>Not searched yet</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
var DATA=/*__DATA__*/null;

(function(){
var GREEN='#12805C', AMBER='#E0A030', RED='#E04B35', GREY='#8E9692';
var REACHED={contacted:1,replied:1,demo:1,customer:1,no:1};
var STATE={ reached:{c:GREEN,fill:.22,dash:null}, partial:{c:AMBER,fill:.22,dash:null},
            untouched:{c:RED,fill:.14,dash:'7 7'}, unsearched:{c:GREY,fill:.06,dash:'7 7'}, empty:{c:'#B9BFBC',fill:.12,dash:null} };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

var map=L.map('map',{zoomControl:false,preferCanvas:true,zoomSnap:.5,zoomDelta:.5,wheelPxPerZoomLevel:90}).setView([27.705,85.335],13);
L.control.zoom({position:'bottomright'}).addTo(map);
var TILE={maxZoom:19,keepBuffer:6,updateWhenIdle:false,updateWhenZooming:false,detectRetina:false};
var ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
var street=L.tileLayer(ESRI+'World_Street_Map/MapServer/tile/{z}/{y}/{x}',L.extend({attribution:'Tiles &copy; Esri'},TILE));
var sat=L.layerGroup([L.tileLayer(ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',L.extend({attribution:'Imagery &copy; Esri, Maxar'},TILE)),
                      L.tileLayer(ESRI+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',TILE)]);
street.addTo(map);
document.getElementById('type').addEventListener('click',function(e){
  var b=e.target.closest('button'); if(!b) return;
  [].forEach.call(this.children,function(x){x.setAttribute('aria-pressed',x===b)});
  var s=b.dataset.t==='sat'; map.removeLayer(s?street:sat); map.addLayer(s?sat:street); document.body.classList.toggle('sat',s);
});

/* ---- layers: have = reached areas/leads, not = everything still to do ---- */
var have=L.layerGroup(), not=L.layerGroup();
function pin(color){
  return L.divIcon({className:'',iconSize:[26,34],iconAnchor:[13,32],
    html:'<svg class="pin" width="26" height="34" viewBox="0 0 26 34"><path d="M13 1C6.4 1 1.5 5.9 1.5 12.4c0 8.2 9.4 17.6 10.9 19.1a.9.9 0 0 0 1.2 0c1.5-1.5 10.9-10.9 10.9-19.1C24.5 5.9 19.6 1 13 1z" fill="'+color+'" stroke="#fff" stroke-width="2"/><circle cx="13" cy="12.5" r="4.2" fill="#fff"/></svg>'});
}
function popup(l){
  var col=l.status==='new'?RED:(l.status==='no'?GREY:GREEN);
  return '<div class="pop"><b>'+esc(l.name)+'</b><div class="m">'+esc(l.cat||'business')+(l.area?' · '+esc(l.area):'')+'</div>'
    +'<div class="st"><i style="background:'+col+'"></i>'+esc(l.status)+'</div>'
    +(l.phone?'<div class="m" style="margin-top:6px">'+esc(l.phone)+'</div>':'<div class="m" style="margin-top:6px">No phone yet</div>')
    +'<div class="acts">'+(l.wa?'<a class="wa" href="'+esc(l.wa)+'" target="_blank" rel="noopener">WhatsApp</a>':'')
    +'<a href="'+esc(l.page)+'" target="_blank" rel="noopener">Zennly page</a></div>'
    +'<div class="id">Mark it: python3 -m gmaps mark '+l.id+' contacted</div></div>';
}

DATA.areas.forEach(function(a){
  var st=STATE[a.state], g=(a.state==='reached'||a.state==='partial')?have:not;
  L.circle([a.lat,a.lng],{radius:a.radius_m,color:st.c,weight:2,dashArray:st.dash,fillColor:st.c,fillOpacity:st.fill}).addTo(g);
  L.marker([a.lat,a.lng],{icon:L.divIcon({className:'',iconSize:[0,0]}),interactive:false})
    .bindTooltip(a.name,{permanent:true,direction:'center',className:'zone-label'}).addTo(g);
});
var manyPins=DATA.leads.length>400;      // thousands of DOM pins are slow; draw dots on the canvas instead
DATA.leads.forEach(function(l){
  var isHave=!!REACHED[l.status], col=l.status==='new'?RED:(l.status==='no'?GREY:GREEN), g=isHave?have:not;
  var m=manyPins?L.circleMarker([l.lat,l.lng],{radius:5,weight:1.5,color:'#fff',fillColor:col,fillOpacity:1})
                :L.marker([l.lat,l.lng],{icon:pin(col)});
  m.bindPopup(popup(l)).addTo(g);
});
function show(v){
  [].forEach.call(document.getElementById('seg').children,function(b){b.setAttribute('aria-pressed',b.dataset.v===v)});
  v==='not'?map.removeLayer(have):map.addLayer(have);
  v==='have'?map.removeLayer(not):map.addLayer(not);
}
document.getElementById('seg').addEventListener('click',function(e){ var b=e.target.closest('button'); if(b) show(b.dataset.v); });
show('all');

/* open on the busiest area, else the whole valley */
var withData=DATA.areas.filter(function(a){return a.found>0});
if(withData.length) map.fitBounds(L.latLngBounds(withData.map(function(a){return [a.lat,a.lng]})).pad(.5),{maxZoom:14});

/* ---- left card: summary + searchable list ---- */
var T=DATA.totals;
document.getElementById('sum').innerHTML='<b>'+T.found+'</b> businesses mapped &middot; <b>'+T.reached+'</b> reached &middot; <b>'+T.areas_searched+'</b> of '+T.areas_total+' areas searched';
var DOT={reached:GREEN,partial:AMBER,untouched:RED,unsearched:'#C7CDCA',empty:'#C7CDCA'};
var SUB={reached:'Reached',partial:'Partly reached',untouched:'Found, none contacted',unsearched:'Not searched yet',empty:'Searched, nothing found'};
var PINSVG='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.800 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>';
var PLACES=DATA.areas.slice().sort(function(a,b){ return (b.found-b.reached)-(a.found-a.reached) || (b.found-a.found); });
var CITIES=[ {name:'Pokhara',lat:28.2096,lng:83.9856,z:13}, {name:'Chitwan',lat:27.68,lng:84.43,z:12},
             {name:'Biratnagar',lat:26.4525,lng:87.2718,z:13}, {name:'Butwal',lat:27.7,lng:83.4484,z:13}, {name:'Birgunj',lat:27.0104,lng:84.877,z:13} ];
var list=document.getElementById('list'), head=document.getElementById('head'), q=document.getElementById('q'), box=document.getElementById('searchbox');
function row(kind,i,name,sub,color){
  return '<button class="row" data-k="'+kind+'" data-i="'+i+'"><span class="ico">'+PINSVG+'</span><span><b>'+esc(name)+'</b><span>'+esc(sub)+'</span></span><i class="dotk" style="background:'+color+'"></i></button>';
}
function render(){
  var t=q.value.trim().toLowerCase(); box.classList.toggle('has',!!t);
  var a=PLACES.map(function(p,i){return {p:p,i:i}}).filter(function(x){return !t||x.p.name.toLowerCase().indexOf(t)>-1});
  var c=CITIES.map(function(p,i){return {p:p,i:i}}).filter(function(x){return !t||x.p.name.toLowerCase().indexOf(t)>-1});
  head.textContent=t?'Results':'Go here next';
  var h=a.map(function(x){ var p=x.p; return row('a',x.i,p.name, SUB[p.state]+(p.found?' · '+p.reached+' of '+p.found+' contacted':''), DOT[p.state]); }).join('');
  if(!t || c.length) h+=(t?'':'<div class="head" style="padding:12px 10px 6px">Other cities</div>')+c.map(function(x){return row('c',x.i,x.p.name,'City · no data yet','#C7CDCA')}).join('');
  list.innerHTML=h||'<div class="empty">No match. Press Enter to search the whole map.</div>';
}
render();
q.addEventListener('input',render);
document.getElementById('clear').addEventListener('click',function(){ q.value=''; render(); q.focus(); });
list.addEventListener('click',function(e){
  var b=e.target.closest('.row'); if(!b) return;
  if(b.dataset.k==='a'){ var p=PLACES[b.dataset.i]; map.flyTo([p.lat,p.lng],15,{duration:1}); }
  else { var c=CITIES[b.dataset.i]; map.flyTo([c.lat,c.lng],c.z,{duration:1}); }
});
q.addEventListener('keydown',function(e){
  if(e.key!=='Enter'||!q.value.trim()) return;
  fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&accept-language=en&countrycodes=np&q='+encodeURIComponent(q.value))
    .then(function(r){return r.json()}).then(function(r){ if(r[0]) map.flyTo([+r[0].lat,+r[0].lon],13,{duration:1}); }).catch(function(){});
});
})();
</script>
</body>
</html>
