server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Favicon
    location = /favicon.ico {
        expires 30d;
        log_not_found off;
        access_log off;
    }

    # Never cache index.html — Vite uses content hashes for assets
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
    }

    # Served under a path prefix (VITE_BASE_PATH=/book/, staging only) when the marketplace
    # proxies the booking flow through its own origin. Vite's `base` only changes what the built
    # HTML/JS ask for, not where the build output actually lives on disk — files stay at
    # /usr/share/nginx/html/assets/..., so nginx has to map /book/* back onto the existing root.
    # `rewrite ... break` strips the prefix and stops further rewrite processing WITHOUT
    # re-entering location matching, so try_files below resolves against the stripped URI
    # directly, never falling through to the /assets/, /favicon.ico or /index.html blocks above —
    # this location has to carry its own equivalent caching rules, not rely on theirs.
    location /book/assets/ {
        rewrite ^/book/(.*)$ /$1 break;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback under the prefix — same try_files shape as the root fallback below, just
    # against the rewritten (prefix-stripped) URI.
    location /book/ {
        rewrite ^/book/(.*)$ /$1 break;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri $uri/ /index.html;
    }

    # Served at the root directly (e.g. dev-app.zennly.io on its own, outside the marketplace
    # proxy) once VITE_BASE_PATH is set: BrowserRouter's basename is now "/book", so an
    # unprefixed route like /nuad-thai-spa loads the JS but matches no route in the router.
    # 302 (not 301) so this stops firing on its own the moment VITE_BASE_PATH is unset again,
    # rather than an old cached redirect outliving the config that caused it. $request_uri
    # carries the query string along, same reasoning as connectors' own dev-only redirect.
    location / {
        return 302 /book$request_uri;
    }
}
