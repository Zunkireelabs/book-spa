name: Rollback

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: "Commit SHA to roll back to (must have a prod-<sha> image already in GHCR)"
        required: true
        type: string
      reason:
        description: "Reason for rollback"
        required: false
        type: string
        default: "Production issue"

env:
  IMAGE: ghcr.io/zunkireelabs/book-spa

jobs:
  rollback:
    name: Rollback to ${{ inputs.commit_sha }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Rollback via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          envs: GHCR_USER,GHCR_TOKEN,TARGET_SHA,REASON,IMAGE
          env:
            GHCR_USER: ${{ secrets.GHCR_PULL_USER }}
            GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
            TARGET_SHA: ${{ inputs.commit_sha }}
            REASON: ${{ inputs.reason }}
            IMAGE: ${{ env.IMAGE }}
          script: |
            set -e
            cd /home/zunkireelabs/devprojects/nuad-thai-web-app-prod
            echo "Rolling back to $TARGET_SHA"
            echo "Reason: $REASON"
            echo "NOTE: this rolls back CODE ONLY — the database is never touched."
            echo "If the bad deploy included a migration, resolve that manually first,"
            echo "then roll FORWARD to a real commit rather than staying pinned here."
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            if ! docker manifest inspect "$IMAGE:prod-$TARGET_SHA" > /dev/null 2>&1; then
              echo "ERROR: image $IMAGE:prod-$TARGET_SHA not found in GHCR."
              echo "That SHA was never built & pushed via the normal deploy pipeline."
              exit 1
            fi
            docker pull "$IMAGE:prod-$TARGET_SHA"
            docker tag "$IMAGE:prod-$TARGET_SHA" "$IMAGE:prod"
            docker compose up -d
            docker image prune -f
            echo "Waiting for container to be healthy..."
            sleep 10
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' nuad-thai-prod 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Rollback successful! Container is healthy."
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Rollback failed — container did not become healthy"
            docker logs nuad-thai-prod --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://zenly.zunkireelabs.com)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Rollback verified (HTTP $HTTP_CODE)"
          else
            echo "Health check failed after rollback (HTTP $HTTP_CODE)"
            exit 1
          fi
