name: Production Health Check

on:
  schedule:
    # Every 10 minutes. GitHub emails the repo owner when a scheduled run fails.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  probe:
    name: Probe production PostgREST
    runs-on: ubuntu-latest
    # Two separate defenses against this monitor silently watching the wrong
    # database — do not delete either one as "redundant" with the other:
    #
    # 1. `environment: production` pins secret resolution to the `production`
    #    GitHub Environment. The secret names VITE_SUPABASE_URL/ANON_KEY exist
    #    at THREE scopes (repo, `production`, `staging`); without an explicit
    #    `environment:` here, secrets resolve at repo scope, and the repo-level
    #    pair predates the staging/prod split. That means this workflow could
    #    probe staging under a job titled "Production Health Check" and stay
    #    green through a real production outage. Deliberately NOT using the
    #    production-db environment (a different one): it carries a required
    #    reviewer, so a scheduled job would block on approval forever. The
    #    `production` environment (this one) has zero protection rules, so
    #    scheduled unattended runs still work.
    # 2. The guard step below is a second, independent check: even after (1),
    #    a future edit to the `production` environment's secret VALUES (not
    #    just which environment is selected) could still point this at the
    #    wrong project. The guard fails loudly, at probe time, if the resolved
    #    SUPABASE_URL isn't actually the production project ref.
    environment: production
    steps:
      - name: Guard against probing the wrong database
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
        run: |
          if [[ "$SUPABASE_URL" != *"pmbvogiphelmpjdalmtv"* ]]; then
            echo "FAIL: SUPABASE_URL does not contain the production project ref (pmbvogiphelmpjdalmtv)."
            echo "Resolved SUPABASE_URL: $SUPABASE_URL"
            echo "This job is named 'Production Health Check' but the secret it resolved points at a"
            echo "non-production database (likely staging). Check which GitHub Environment this job"
            echo "is running under and that environment's VITE_SUPABASE_URL secret value."
            exit 1
          fi
      - name: Send 20 probes and fail on aborted transactions or slow cold plans
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          # 20 probes, not 1. A poisoned PostgREST pool connection is roughly 1
          # in 10, so a single request has about a 90% chance of missing it and
          # reporting false health.
          ATTEMPTS=20
          failures=0
          aborted=0
          min_ms=999999
          max_ms=0
          over_2s=0
          over_5s=0

          # Probing bookings, not branches: branches?select=id&limit=1 plans in
          # ~1ms and is blind to RLS cold-plan cost. bookings?select=id&limit=1
          # forces the planner through the full policy tree for the anon role
          # (measured on prod: 36ms planning / 243ms execution warm) while
          # still being cheap enough to run 20x every 10 minutes. anon has no
          # visibility into bookings rows, so an empty `[]` body here is the
          # EXPECTED, HEALTHY response — only a body containing "code" is an
          # error. (A separate single liveness probe against branches runs
          # after this loop, below, since it's the one that can actually
          # detect "reachable but returning nothing".)
          for i in $(seq 1 $ATTEMPTS); do
            response="$(curl -s --max-time 15 -w $'\nTIME:%{time_total}' \
              -H "apikey: $ANON_KEY" \
              -H "Authorization: Bearer $ANON_KEY" \
              "$SUPABASE_URL/rest/v1/bookings?select=id&limit=1" \
              || echo -e '{"code":"CURL_FAILED"}\nTIME:15.000')"

            time_total="$(printf '%s' "$response" | grep '^TIME:' | tail -1 | sed 's/^TIME://')"
            body="$(printf '%s' "$response" | sed '$d')"

            # curl -w emits seconds as a decimal (e.g. 0.243, 4.200, 12.500).
            # Convert to integer milliseconds via awk so the rest of this
            # script can use plain bash integer comparisons — no bash
            # floating-point, and no dependency on how many decimal places
            # curl happened to print.
            ms="$(awk -v t="$time_total" 'BEGIN{printf "%d", (t*1000)+0.5}')"

            if [ "$ms" -lt "$min_ms" ]; then min_ms=$ms; fi
            if [ "$ms" -gt "$max_ms" ]; then max_ms=$ms; fi
            if [ "$ms" -gt 2000 ]; then over_2s=$((over_2s + 1)); fi
            if [ "$ms" -gt 5000 ]; then over_5s=$((over_5s + 1)); fi

            if printf '%s' "$body" | grep -q '25P02'; then
              aborted=$((aborted + 1))
              echo "probe $i: ABORTED TRANSACTION (${ms}ms) -> $body"
            elif printf '%s' "$body" | grep -q '"code"'; then
              failures=$((failures + 1))
              echo "probe $i: error (${ms}ms) -> $body"
            else
              echo "probe $i: ok (${ms}ms)"
            fi
          done

          echo ""
          echo "=== $ATTEMPTS probes: $aborted aborted, $failures other errors ==="
          echo "=== latency: min=${min_ms}ms max=${max_ms}ms | over 2000ms: $over_2s | over 5000ms: $over_5s ==="

          if [ "$aborted" -gt 0 ]; then
            echo "FAIL: production is returning 25P02 on $aborted/$ATTEMPTS probes."
            echo "A PostgREST pool connection is stuck in an aborted transaction."
            echo "Pull Postgres ERROR logs now (Supabase -> Logs -> Postgres) — the"
            echo "originating error is only visible there, and only briefly."
            exit 1
          fi

          if [ "$failures" -gt 0 ]; then
            echo "FAIL: $failures/$ATTEMPTS probes returned an error."
            exit 1
          fi

          if [ "$over_5s" -gt 0 ]; then
            echo "FAIL: $over_5s/$ATTEMPTS probes took longer than 5s (max ${max_ms}ms)."
            echo "The authenticated role's statement_timeout is 8s, so 5s means queries are"
            echo "close to dying outright. This is almost certainly a cold-plan PostgREST"
            echo "connection hitting the RLS policy tree — see docs/runbooks/rls-plan-complexity.md."
            exit 1
          fi

          if [ "$over_2s" -ge 3 ]; then
            echo "FAIL: $over_2s/$ATTEMPTS probes took longer than 2s (sustained slow-plan pattern, not a one-off)."
            echo "This matches cold RLS re-planning after a connection-pool recycle (migration,"
            echo "PostgREST restart, Supabase-side restart, or ordinary pool churn) — see"
            echo "docs/runbooks/rls-plan-complexity.md for the measured cause and candidate fixes."
            exit 1
          fi

          echo "OK: production healthy (bookings probe latency within bounds)."
      - name: Liveness probe against branches (expects non-empty result)
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -uo pipefail

          # This is deliberately a second, separate probe from the bookings
          # loop above — do not delete it as "redundant". The bookings probe
          # legitimately returns `[]` for anon (anon sees no bookings rows),
          # so it can never distinguish "database reachable but genuinely
          # empty" from "database reachable but broken and returning nothing".
          # branches CAN make that distinction: anon genuinely sees 9 rows
          # there, so an empty `[]` here means something is actually wrong.
          body="$(curl -s --max-time 15 \
            -H "apikey: $ANON_KEY" \
            -H "Authorization: Bearer $ANON_KEY" \
            "$SUPABASE_URL/rest/v1/branches?select=id&limit=1" || echo '{"code":"CURL_FAILED"}')"

          if printf '%s' "$body" | grep -q '"code"'; then
            echo "FAIL: branches liveness probe returned an error -> $body"
            exit 1
          fi

          if [ "$(printf '%s' "$body" | tr -d '[:space:]')" = "[]" ]; then
            echo "FAIL: branches liveness probe returned an empty array."
            echo "anon should see at least 1 of the 9 branches rows in production. An empty"
            echo "result here (as opposed to the bookings probe above, which is expected to be"
            echo "empty for anon) means the database is reachable but not returning real data —"
            echo "check RLS policies on branches and whether anon's role/grants changed."
            exit 1
          fi

          echo "OK: branches liveness probe returned data -> $body"
