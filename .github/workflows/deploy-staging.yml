name: Deploy to Staging

on:
  push:
    branches: [stage]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zunkireelabs/book-spa

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: checks
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:stage
            ${{ env.IMAGE }}:stage-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
            VITE_ENABLE_MEMBERSHIP=true
            VITE_ENABLE_VOUCHERS=true
            VITE_ENABLE_CUSTOMER_REFERRALS=true
            VITE_ENABLE_OUTREACH=true
            VITE_ENABLE_PLATFORM_ADMIN=true

  migrate:
    name: Apply Migrations
    runs-on: ubuntu-latest
    needs: checks
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply pending migrations to staging
        env:
          PGHOST: ${{ secrets.STAGE_PGHOST }}
          PGUSER: ${{ secrets.STAGE_PGUSER }}
          PGPASSWORD: ${{ secrets.STAGE_PGPASSWORD }}
          PGDATABASE: ${{ secrets.STAGE_PGDATABASE }}
        run: scripts/migrate-apply.sh stage

  deploy:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-push, migrate]
    environment: staging
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 25m
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /home/zunkireelabs/devprojects/nuad-thai-web-app
            git fetch origin stage
            git reset --hard origin/stage
            git clean -fd
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose -f docker-compose.dev.yml pull
            docker compose -f docker-compose.dev.yml up -d
            docker image prune -f
            echo "Waiting for container to be healthy..."
            sleep 10
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' nuad-thai-dev 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs nuad-thai-dev --tail 50
            exit 1

      - name: Verify Health
        run: |
          # Check login page (root redirects externally now)
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://${{ vars.STAGING_DOMAIN }}/login)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Staging health check passed (HTTP $HTTP_CODE)"
          else
            echo "Staging health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
