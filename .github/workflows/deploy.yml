name: Deploy to Production

on:
  push:
    branches: [main]

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/zunkireelabs/book-spa

jobs:
  checks:
    name: Pre-deploy Checks
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_POSTHOG_KEY: ${{ secrets.VITE_POSTHOG_KEY }}
          VITE_POSTHOG_HOST: ${{ secrets.VITE_POSTHOG_HOST }}

  build-push:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: checks
    environment: production
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:prod
            ${{ env.IMAGE }}:prod-${{ github.sha }}
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
            VITE_POSTHOG_KEY=${{ secrets.VITE_POSTHOG_KEY }}
            VITE_POSTHOG_HOST=${{ secrets.VITE_POSTHOG_HOST }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Detects whether THIS push added migration files (pure git, no DB access —
  # keeps PROD_DB_URL scoped to the gated apply job below). Its boolean output
  # decides whether the approval-gated `migrate` job runs at all, so code-only
  # deploys are never paused.
  migrate-check:
    name: Detect Pending Migrations
    runs-on: ubuntu-latest
    needs: checks
    outputs:
      has_migrations: ${{ steps.detect.outputs.has_migrations }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          BEFORE="${{ github.event.before }}"
          # A stage->main promotion is a merge commit; if `before` is absent or
          # unfetched, fall back to the merge's first parent (main's prior tip).
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            BEFORE=$(git rev-parse HEAD^1)
          fi
          # Only NUMBERED migration files (NNN[a-z]?_*.sql) count, excludes _TEMPLATE.sql.
          if git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ | grep -qE '/[0-9]{3}[a-z]?_[^/]*\.sql$'; then
            echo "has_migrations=true" >> "$GITHUB_OUTPUT"
            echo "Migration files detected in this push — apply job will require approval:"
            git diff --name-only "$BEFORE" HEAD -- supabase/migrations/ | grep -E '/[0-9]{3}[a-z]?_[^/]*\.sql$'
          else
            echo "has_migrations=false" >> "$GITHUB_OUTPUT"
            echo "No migration files in this push — apply job will be skipped."
          fi

  # Applies pending migrations to the PROD DB BEFORE the container swaps. Runs
  # only when migrate-check found migration files, and is gated by the
  # `production-db` environment's required reviewers — a human must approve
  # before any schema change touches prod. Fail-closed: scripts/migrate-apply.sh
  # proves connectivity, then applies ledger-pending versions in order, aborting
  # on any error (which blocks the deploy job below).
  migrate:
    name: Apply Pending Migrations
    runs-on: ubuntu-latest
    needs: [build-push, migrate-check]
    if: needs.migrate-check.outputs.has_migrations == 'true'
    environment: production-db
    steps:
      - uses: actions/checkout@v4
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client
      - name: Apply pending migrations
        env:
          PROD_DB_URL: ${{ secrets.PROD_DB_URL }}
        run: scripts/migrate-apply.sh prod

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    # Waits on migrate: proceeds when it succeeded (migrations applied) OR was
    # skipped (no migrations in this push); never deploys when migrate failed,
    # so new code can't land on a half-migrated DB.
    needs: [build-push, migrate]
    if: >-
      always() &&
      needs.build-push.result == 'success' &&
      (needs.migrate.result == 'success' || needs.migrate.result == 'skipped')
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        env:
          GHCR_USER: ${{ secrets.GHCR_PULL_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: GHCR_USER,GHCR_TOKEN
          script: |
            set -e
            cd /home/zunkireelabs/devprojects/nuad-thai-web-app-prod
            git pull origin main
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -f
            echo "Waiting for container to be healthy..."
            sleep 10
            for i in $(seq 1 12); do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' nuad-thai-prod 2>/dev/null || echo "unknown")
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                exit 0
              fi
              echo "Attempt $i/12: Status is $STATUS, waiting..."
              sleep 10
            done
            echo "Container did not become healthy within 2 minutes"
            docker logs nuad-thai-prod --tail 50
            exit 1

      - name: Verify Health
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://zenly.zunkireelabs.com)
          if [ "$HTTP_CODE" = "200" ]; then
            echo "Health check passed (HTTP $HTTP_CODE)"
          else
            echo "Health check failed (HTTP $HTTP_CODE)"
            exit 1
          fi
